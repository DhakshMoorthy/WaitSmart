## Render Blueprint — one-click deploy for WaitSmart backend
## https://render.com/docs/blueprint-spec
## To deploy: connect your GitHub repo on Render Dashboard → "New Blueprint Instance"

services:
  - type: web
    name: waitsmart-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --filter @waitsmart/server... && pnpm run build:deploy
    startCommand: node server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: waitsmart-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: waitsmart-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "15m"
      - key: JWT_REFRESH_TTL
        value: "30d"
      - key: CORS_ORIGINS
        value: "https://waitsmart.vercel.app,http://localhost:3000"
    healthCheckPath: /health

  - type: keyvalue
    name: waitsmart-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # internal-only; API connects via Render private network

databases:
  - name: waitsmart-db
    plan: free
    databaseName: waitsmart
    user: waitsmart
    region: singapore
