services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waitsmart
      # Local-dev default. Override with POSTGRES_PASSWORD=... in your shell / a .env next to this file
      # (also update DATABASE_URL in server/.env). The password only applies when the volume is first created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waitsmart}
      POSTGRES_DB: waitsmart
    ports:
      # Loopback only: not reachable from other machines on your network.
      - "127.0.0.1:5432:5432"
    volumes:
      - waitsmart_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis ships with no authentication; set REDIS_PASSWORD to require one
    # (then use redis://:<password>@localhost:6379 in REDIS_URL).
    command: ["sh", "-c", "exec redis-server ${REDIS_PASSWORD:+--requirepass \"$REDIS_PASSWORD\"}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  waitsmart_pg_data:
