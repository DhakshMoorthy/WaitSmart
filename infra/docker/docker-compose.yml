services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: waitsmart
      POSTGRES_PASSWORD: waitsmart
      POSTGRES_DB: waitsmart
    ports:
      - "5432:5432"
    volumes:
      - waitsmart_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  waitsmart_pg_data:
